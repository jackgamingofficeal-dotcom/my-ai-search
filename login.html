<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>TOR AI — Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  background:#030303;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% 18%,rgba(180,0,0,.18),transparent 32%),
    radial-gradient(circle at 50% 85%,rgba(90,0,0,.12),transparent 35%),
    #030303;
}

/* ===== MAIN ===== */

.tor-login{
  position:relative;
  width:min(100%,430px);
  min-height:100vh;
  padding:30px 20px 24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* background glow */

.tor-login::before{
  content:"";
  position:absolute;
  width:330px;
  height:330px;
  left:50%;
  top:30%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#8d0000;
  opacity:.12;
  filter:blur(70px);
  pointer-events:none;
}

/* ===== BRAND ===== */

.tor-brand{
  position:relative;
  z-index:5;
  text-align:center;
  margin-bottom:18px;
}

.tor-brand-small{
  font-size:7px;
  font-weight:900;
  letter-spacing:3px;
  color:#777;
  margin-bottom:8px;
}

.tor-brand h1{
  font-size:34px;
  line-height:1;
  letter-spacing:2px;
  font-weight:950;
  color:#eee;
  text-shadow:
    2px 2px 0 #555,
    0 0 18px rgba(255,20,20,.3);
}

.tor-brand h1 span{
  color:#ff3333;
  text-shadow:
    0 0 12px rgba(255,20,20,.7),
    0 0 28px rgba(255,0,0,.3);
}

.tor-brand p{
  margin-top:7px;
  font-size:7px;
  font-weight:900;
  letter-spacing:4px;
  color:#aaa;
}

/* ===== 3D CORE ===== */

.tor-core-stage{
  position:relative;
  width:230px;
  height:230px;
  margin:4px auto 18px;
  display:grid;
  place-items:center;
  perspective:900px;
  transform-style:preserve-3d;
}

/* rings */

.tor-ring{
  position:absolute;
  left:50%;
  top:50%;
  width:190px;
  height:190px;
  margin:-95px 0 0 -95px;
  border-radius:50%;
  border:2px solid rgba(255,45,45,.45);
  transform-style:preserve-3d;
}

.tor-ring-a{
  animation:ringA 6s linear infinite;
  box-shadow:0 0 14px rgba(255,20,20,.22);
}

.tor-ring-b{
  width:215px;
  height:215px;
  margin:-107.5px 0 0 -107.5px;
  border-color:rgba(255,90,90,.28);
  animation:ringB 8s linear infinite reverse;
}

.tor-ring-c{
  width:220px;
  height:145px;
  margin:-72.5px 0 0 -110px;
  border-color:rgba(255,30,30,.23);
  animation:ringC 10s linear infinite;
}

@keyframes ringA{
  from{transform:rotateX(68deg) rotateZ(0)}
  to{transform:rotateX(68deg) rotateZ(360deg)}
}

@keyframes ringB{
  from{transform:rotateY(67deg) rotateZ(0)}
  to{transform:rotateY(67deg) rotateZ(360deg)}
}

@keyframes ringC{
  from{transform:rotateX(72deg) rotateY(18deg) rotateZ(0)}
  to{transform:rotateX(72deg) rotateY(18deg) rotateZ(360deg)}
}

/* reactor */

.tor-core{
  position:relative;
  width:132px;
  height:132px;
  border-radius:50%;
  padding:9px;
  display:grid;
  place-items:center;
  transform-style:preserve-3d;
  transform:translateZ(35px) rotateX(8deg);
  background:
    conic-gradient(
      #ff4444,
      #360000,
      #090909,
      #b00000,
      #220000,
      #ff4a4a,
      #090909,
      #ff3333
    );
  box-shadow:
    0 0 0 2px rgba(255,80,80,.16),
    0 0 25px rgba(255,20,20,.48),
    0 18px 40px rgba(0,0,0,.9);
  animation:coreFloat 4s ease-in-out infinite;
}

@keyframes coreFloat{
  0%,100%{
    transform:translateZ(35px) rotateX(8deg) rotateY(-5deg);
  }
  50%{
    transform:translateZ(50px) rotateX(10deg) rotateY(7deg);
  }
}

.tor-core-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 50%,
      #520909 0%,
      #190000 42%,
      #070707 76%);
  border:2px solid rgba(255,70,70,.4);
  box-shadow:
    inset 8px 8px 15px rgba(255,255,255,.06),
    inset -10px -10px 18px rgba(0,0,0,.95);
}

/* energy */

.tor-energy{
  position:absolute;
  width:62px;
  height:62px;
  border-radius:50%;
  background:
    radial-gradient(circle,
      #fff 0 4%,
      #ff7777 12%,
      #ff1d1d 29%,
      #9d0000 45%,
      transparent 72%);
  box-shadow:
    0 0 25px rgba(255,30,30,.95),
    0 0 55px rgba(255,0,0,.4);
  animation:energyPulse 1.7s ease-in-out infinite;
}

@keyframes energyPulse{
  0%,100%{transform:scale(.78);opacity:.72}
  50%{transform:scale(1.12);opacity:1}
}

.tor-core-symbol{
  position:relative;
  z-index:2;
  font-size:20px;
  color:#fff;
  text-shadow:0 0 14px #ff2222;
}

.tor-core-name{
  position:relative;
  z-index:2;
  margin-top:2px;
  font-size:10px;
  font-weight:950;
  letter-spacing:3px;
}

.tor-core-engine{
  position:relative;
  z-index:2;
  margin-top:5px;
  color:#ff7777;
  font-size:5px;
  font-weight:900;
  letter-spacing:1.3px;
}

.tor-core-engine i{
  display:inline-block;
  width:4px;
  height:4px;
  border-radius:50%;
  margin-right:3px;
  background:#ff2929;
  box-shadow:0 0 8px #ff2020;
}

/* ===== LOGIN CARD ===== */

.tor-login-card{
  position:relative;
  z-index:8;
  width:100%;
  padding:20px 17px 18px;
  border-radius:20px;
  border:1px solid rgba(255,45,45,.28);
  background:
    linear-gradient(145deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.018));
  box-shadow:
    0 20px 50px rgba(0,0,0,.7),
    inset 0 1px rgba(255,255,255,.07);
  backdrop-filter:blur(12px);
}

.tor-login-card h2{
  text-align:center;
  font-size:19px;
  letter-spacing:.4px;
  margin-bottom:5px;
}

.tor-login-card .sub{
  text-align:center;
  color:#777;
  font-size:9px;
  margin-bottom:17px;
}

/* fields */

.tor-field{
  margin-bottom:12px;
}

.tor-field label{
  display:block;
  margin-bottom:6px;
  color:#999;
  font-size:8px;
  font-weight:900;
  letter-spacing:1px;
}

.tor-input{
  width:100%;
  height:45px;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.1);
  outline:none;
  padding:0 13px;
  color:#fff;
  background:#080808;
  box-shadow:
    inset 0 4px 10px rgba(0,0,0,.6);
  font-size:11px;
}

.tor-input:focus{
  border-color:rgba(255,45,45,.65);
  box-shadow:
    0 0 0 2px rgba(255,20,20,.08),
    inset 0 4px 10px rgba(0,0,0,.6),
    0 0 16px rgba(255,20,20,.1);
}

.tor-input::placeholder{
  color:#555;
}

/* options */

.tor-options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:4px 1px 15px;
}

.tor-remember{
  color:#777;
  font-size:8px;
}

.tor-forgot{
  color:#ff4a4a;
  font-size:8px;
  font-weight:800;
}

/* login button */

.tor-login-btn{
  width:100%;
  height:47px;
  border:0;
  border-radius:13px;
  color:#fff;
  font-size:11px;
  font-weight:950;
  letter-spacing:1.2px;
  background:
    linear-gradient(180deg,#ff3b3b,#b90000 55%,#720000);
  box-shadow:
    0 7px 20px rgba(180,0,0,.35),
    inset 0 1px rgba(255,255,255,.25);
}

.tor-login-btn:active{
  transform:scale(.985);
}

/* divider */

.tor-divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:17px 0;
  color:#444;
  font-size:8px;
}

.tor-divider::before,
.tor-divider::after{
  content:"";
  flex:1;
  height:1px;
  background:rgba(255,255,255,.07);
}

/* create */

.tor-create{
  width:100%;
  height:43px;
  border-radius:12px;
  border:1px solid rgba(255,45,45,.35);
  background:transparent;
  color:#ff6666;
  font-size:9px;
  font-weight:900;
  letter-spacing:.8px;
}

/* footer */

.tor-footer{
  position:relative;
  z-index:5;
  margin-top:17px;
  text-align:center;
  color:#454545;
  font-size:7px;
  letter-spacing:1px;
}

.tor-footer span{
  color:#a00000;
  margin:0 4px;
}

/* ===== SMALL PHONES ===== */

@media(max-width:360px){

  .tor-login{
    padding:22px 14px;
  }

  .tor-brand h1{
    font-size:29px;
  }

  .tor-core-stage{
    width:205px;
    height:205px;
    transform:scale(.9);
    margin-top:-5px;
    margin-bottom:8px;
  }

  .tor-login-card{
    padding:17px 14px;
  }
}

/* accessibility */

@media(prefers-reduced-motion:reduce){
  .tor-ring,
  .tor-core,
  .tor-energy{
    animation:none !important;
  }
}
</style>
</head>

<body>

<main class="tor-login">

  <div class="tor-brand">
    <div class="tor-brand-small">POWERED BY TOR AI</div>
    <h1>TOR <span>AI</span></h1>
    <p>NEURAL CORE</p>
  </div>

  <div class="tor-core-stage">
    <div class="tor-ring tor-ring-a"></div>
    <div class="tor-ring tor-ring-b"></div>
    <div class="tor-ring tor-ring-c"></div>

    <div class="tor-core">
      <div class="tor-core-inner">
        <div class="tor-energy"></div>
        <div class="tor-core-symbol">✦</div>
        <div class="tor-core-name">TOR AI</div>
        <div class="tor-core-engine">
          <i></i> NEURAL ENGINE
        </div>
      </div>
    </div>
  </div>

  <section class="tor-login-card">

    <h2>Welcome Back</h2>
    <p class="sub">Sign in to continue to your AI workspace</p>

    <form onsubmit="return false;">

      <div class="tor-field">
        <label>Email Address</label>
        <input
          class="tor-input"
          type="email"
          placeholder="you@example.com"
          autocomplete="email">
      </div>

      <div class="tor-field">
        <label>Password</label>
        <input
          class="tor-input"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password">
      </div>

      <div class="tor-options">
        <span class="tor-remember">Remember me</span>
        <span class="tor-forgot">Forgot password?</span>
      </div>

      <button class="tor-login-btn" type="button">
        LOGIN&nbsp; → 
      </button>

      <div class="tor-divider">OR</div>

      <button class="tor-create" type="button">
        CREATE ACCOUNT
      </button>

    </form>

  </section>

  <div class="tor-footer">
    TOR AI <span>•</span> Secure AI Workspace <span>•</span> Neural Core
  </div>

</main>


<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.querySelector("form");
  const inputs = form.querySelectorAll(".tor-input");
  const button = document.querySelector(".tor-login-btn");

  if (!form || inputs.length < 2 || !button) return;

  const API = "https://my-ai-search.jackgamingofficeal.workers.dev";

  button.addEventListener("click", async () => {
    const email = inputs[0].value.trim();
    const password = inputs[1].value;

    if (!email || !password) {
      alert("Please enter your email and password.");
      return;
    }

    button.disabled = true;
    button.textContent = "LOGGING IN...";

    try {
      const response = await fetch(API + "/auth/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify({
          email,
          password
        })
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || data.message || "Login failed.");
      }

      alert("Login successful!");
      window.location.href = "index.html";

    } catch (error) {
      console.error(error);
      alert(error.message || "Something went wrong.");
      button.disabled = false;
      button.innerHTML = "LOGIN&nbsp; →";
    }
  });
});
</script>

</body>
</html>
