<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#030303">
<title>TOR AI — Create Account</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  min-height:100%;
  background:#030303;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 10%,rgba(180,0,0,.18),transparent 30%),
    #030303;
}

.tor-register{
  position:relative;
  width:min(100%,430px);
  min-height:100vh;
  padding:27px 19px 22px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.tor-register:before{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  left:50%;
  top:20%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#900000;
  opacity:.12;
  filter:blur(65px);
}

/* ===== BRAND ===== */

.tor-register-brand{
  position:relative;
  z-index:5;
  text-align:center;
  margin-bottom:9px;
}

.tor-register-brand .mini{
  color:#777;
  font-size:7px;
  font-weight:900;
  letter-spacing:3px;
  margin-bottom:7px;
}

.tor-register-brand h1{
  font-size:40px;
  line-height:.95;
  font-weight:1000;
  letter-spacing:3px;
  background:linear-gradient(
    180deg,#fff,#ddd 40%,#777 62%,#fff
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 4px 12px rgba(0,0,0,.8);
}

.tor-register-brand h1 span{
  color:#ff3030;
  -webkit-text-fill-color:#ff3030;
  text-shadow:
    0 0 10px rgba(255,30,30,.8),
    0 0 28px rgba(255,0,0,.35);
}

.tor-register-brand p{
  margin-top:8px;
  color:#cfcfcf;
  font-size:7px;
  font-weight:950;
  letter-spacing:4px;
}

/* ===== MINI 3D CORE ===== */

.tor-register-core{
  position:relative;
  width:135px;
  height:135px;
  margin:3px auto 13px;
  display:grid;
  place-items:center;
  perspective:800px;
  transform-style:preserve-3d;
}


/* =========================================
   TOR AI — NEW 3 RING ANIMATION
   Mobile Friendly
   ========================================= */

.tor-register-core{
  position:relative;
  width:150px;
  height:150px;
  margin:3px auto 13px;
  display:grid;
  place-items:center;
  overflow:visible;
}


/* =========================================
   TOR AI — PREMIUM CLASSIC NEURAL ORBITS
   ========================================= */

.tor-register-core{
  position:relative;
  width:150px;
  height:150px;
  margin:3px auto 13px;
  display:grid;
  place-items:center;
  overflow:visible;
}

/* Common ring */
.reg-ring{
  position:absolute;
  left:50%;
  top:50%;
  display:block;
  border-radius:50%;
  pointer-events:none;
  box-sizing:border-box;
  transform-origin:center center;
  will-change:transform;
}

/* =========================================
   OUTER RING
   ========================================= */

.reg-ring.a{
  width:142px;
  height:142px;
  margin:0;

  border:1.5px solid rgba(255,45,45,.72);

  transform:translate(-50%,-50%) rotate(0deg);

  animation:
    classicRingA 8s linear infinite;

  box-shadow:
    0 0 4px rgba(255,35,35,.25);
}


/* =========================================
   HORIZONTAL RING
   ========================================= */

.reg-ring.b{
  width:146px;
  height:72px;
  margin:0;

  border:1px solid rgba(255,105,105,.58);

  transform:translate(-50%,-50%) rotate(0deg);

  animation:
    classicRingB 6.5s linear infinite reverse;

  box-shadow:
    0 0 5px rgba(255,60,60,.20);
}


/* =========================================
   VERTICAL RING
   ========================================= */

.reg-ring.c{
  width:72px;
  height:146px;
  margin:0;

  border:1px solid rgba(255,70,70,.58);

  transform:translate(-50%,-50%) rotate(0deg);

  animation:
    classicRingC 7.5s linear infinite;

  box-shadow:
    0 0 5px rgba(255,50,50,.18);
}


/* =========================================
   SMOOTH CLASSIC ROTATION
   ========================================= */

@keyframes classicRingA{

  0%{
    transform:
      translate(-50%,-50%)
      rotate(0deg);
  }

  100%{
    transform:
      translate(-50%,-50%)
      rotate(360deg);
  }

}


@keyframes classicRingB{

  0%{
    transform:
      translate(-50%,-50%)
      rotate(0deg);
  }

  100%{
    transform:
      translate(-50%,-50%)
      rotate(360deg);
  }

}


@keyframes classicRingC{

  0%{
    transform:
      translate(-50%,-50%)
      rotate(0deg);
  }

  100%{
    transform:
      translate(-50%,-50%)
      rotate(360deg);
  }

}


/* =========================================
   MOBILE TUNING
   ========================================= */

@media (max-width:600px){

  .tor-register-core{
    width:150px;
    height:150px;
  }

  .reg-ring.a{
    width:142px;
    height:142px;
    border-width:1.5px;
  }

  .reg-ring.b{
    width:148px;
    height:72px;
    border-width:1px;
  }

  .reg-ring.c{
    width:72px;
    height:148px;
    border-width:1px;
  }

}
.reg-core{
  position:relative;
  width:76px;
  height:76px;
  border-radius:50%;
  padding:6px;
  display:grid;
  place-items:center;
  transform-style:preserve-3d;
  transform:translateZ(28px);
  background:
    conic-gradient(
      #ff4444,#300000,#080808,#a00000,
      #1b0000,#ff5555,#080808,#ff3333
    );
  box-shadow:
    0 0 20px rgba(255,20,20,.55),
    0 13px 28px rgba(0,0,0,.85);
}

.reg-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle,#4c0707,#100000 55%,#050505);
  border:1px solid rgba(255,80,80,.42);
}

.reg-energy{
  position:absolute;
  width:34px;
  height:34px;
  border-radius:50%;
  background:
    radial-gradient(circle,#fff 0 5%,#ff5555 18%,#c00000 42%,transparent 72%);
  box-shadow:0 0 28px rgba(255,30,30,.9);
  animation:regEnergy 1.5s ease-in-out infinite;
}

@keyframes regEnergy{
  0%,100%{transform:scale(.78);opacity:.72}
  50%{transform:scale(1.12);opacity:1}
}

.reg-symbol{
  position:relative;
  z-index:2;
  color:#fff;
  font-size:14px;
  text-shadow:0 0 12px #ff2222;
}

/* ===== REGISTER CARD ===== */

.tor-register-card{
  position:relative;
  z-index:8;
  width:100%;
  padding:19px 16px 17px;
  border-radius:20px;
  border:1px solid rgba(255,45,45,.28);
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.018)
    );
  box-shadow:
    0 20px 50px rgba(0,0,0,.72),
    inset 0 1px rgba(255,255,255,.07);
  backdrop-filter:blur(12px);
}

.tor-register-card h2{
  text-align:center;
  font-size:19px;
  margin-bottom:5px;
}

.tor-register-card .sub{
  text-align:center;
  color:#777;
  font-size:9px;
  margin-bottom:15px;
}

.reg-field{
  margin-bottom:10px;
}

.reg-field label{
  display:block;
  margin-bottom:5px;
  color:#999;
  font-size:8px;
  font-weight:900;
  letter-spacing:1px;
}

.reg-input{
  width:100%;
  height:43px;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.1);
  outline:none;
  padding:0 12px;
  background:#080808;
  color:#fff;
  font-size:10px;
  box-shadow:inset 0 4px 10px rgba(0,0,0,.6);
}

.reg-input:focus{
  border-color:rgba(255,45,45,.65);
  box-shadow:
    0 0 0 2px rgba(255,20,20,.07),
    inset 0 4px 10px rgba(0,0,0,.6);
}

.reg-input::placeholder{
  color:#505050;
}

.reg-check{
  display:flex;
  gap:7px;
  align-items:flex-start;
  margin:5px 1px 14px;
  color:#777;
  font-size:7px;
  line-height:1.5;
}

.reg-check input{
  accent-color:#e00000;
  margin-top:2px;
}

.reg-create{
  width:100%;
  height:46px;
  border:0;
  border-radius:13px;
  color:#fff;
  font-size:10px;
  font-weight:950;
  letter-spacing:1.1px;
  background:
    linear-gradient(180deg,#ff3b3b,#b90000 55%,#700000);
  box-shadow:
    0 7px 20px rgba(180,0,0,.35),
    inset 0 1px rgba(255,255,255,.25);
}

.reg-divider{
  display:flex;
  align-items:center;
  gap:9px;
  margin:14px 0;
  color:#444;
  font-size:7px;
}

.reg-divider:before,
.reg-divider:after{
  content:"";
  flex:1;
  height:1px;
  background:rgba(255,255,255,.07);
}

.reg-login{
  width:100%;
  height:41px;
  border-radius:11px;
  border:1px solid rgba(255,45,45,.35);
  background:transparent;
  color:#ff6262;
  font-size:9px;
  font-weight:900;
  letter-spacing:.7px;
}

.reg-footer{
  position:relative;
  z-index:5;
  margin-top:13px;
  color:#444;
  text-align:center;
  font-size:7px;
  letter-spacing:.8px;
}

.reg-footer span{
  color:#9b0000;
  margin:0 4px;
}

@media(max-width:360px){
  .tor-register{
    padding:20px 14px;
  }

  .tor-register-brand h1{
    font-size:35px;
  }

  .tor-register-core{
    transform:scale(.9);
    margin-top:-5px;
    margin-bottom:5px;
  }

  .tor-register-card{
    padding:16px 13px;
  }
}

</style>
</head>

<body>

<main class="tor-register">

  <div class="tor-register-brand">
    <div class="mini">POWERED BY TOR AI</div>
    <h1>TOR <span>AI</span></h1>
    <p>NEURAL CORE</p>
  </div>

  <div class="tor-register-core">
    <div class="reg-ring a"></div>
    <div class="reg-ring b"></div>
    <div class="reg-ring c"></div>

    <div class="reg-core">
      <div class="reg-inner">
        <div class="reg-energy"></div>
        <div class="reg-symbol">✦</div>
      </div>
    </div>
  </div>

  <section class="tor-register-card">

    <h2>Create Account</h2>
    <p class="sub">Join your next-generation AI workspace</p>

    <form onsubmit="return false;">

      <div class="reg-field">
        <label>NAME</label>
        <input
          class="reg-input"
          type="text"
          placeholder="Your name"
          autocomplete="name">
      </div>

      <div class="reg-field">
        <label>EMAIL ADDRESS</label>
        <input
          class="reg-input"
          type="email"
          placeholder="you@example.com"
          autocomplete="email">
      </div>

      <div class="reg-field">
        <label>PASSWORD</label>
        <input
          class="reg-input"
          type="password"
          placeholder="Create a password"
          autocomplete="new-password">
      </div>

      <div class="reg-field">
        <label>CONFIRM PASSWORD</label>
        <input
          class="reg-input"
          type="password"
          placeholder="Confirm your password"
          autocomplete="new-password">
      </div>

      <label class="reg-check">
        <input type="checkbox">
        <span>I agree to the account terms and privacy policy.</span>
      </label>

      <button class="reg-create" type="button">
        CREATE ACCOUNT&nbsp; →
      </button>

      <div class="reg-divider">OR</div>

      <button
        class="reg-login"
        type="button"
        onclick="location.href='login.html'">
        ALREADY HAVE AN ACCOUNT? LOGIN
      </button>

    </form>

  </section>

  <div class="reg-footer">
    TOR AI <span>•</span> Secure AI Workspace <span>•</span> Neural Core
  </div>

</main>


<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.querySelector("form");
  const inputs = form.querySelectorAll(".reg-input");
  const agree = form.querySelector(".reg-check input");
  const button = document.querySelector(".reg-create");

  if (!form || inputs.length < 4 || !agree || !button) return;

  const API = "https://my-ai-search.jackgamingofficeal.workers.dev";

  button.addEventListener("click", async () => {
    const name = inputs[0].value.trim();
    const email = inputs[1].value.trim();
    const password = inputs[2].value;
    const confirmPassword = inputs[3].value;

    if (!name || !email || !password || !confirmPassword) {
      alert("Please fill in all fields.");
      return;
    }

    if (password !== confirmPassword) {
      alert("Passwords do not match.");
      return;
    }

    if (!agree.checked) {
      alert("Please agree to the account terms and privacy policy.");
      return;
    }

    button.disabled = true;
    button.textContent = "CREATING ACCOUNT...";

    try {
      const response = await fetch(API + "/auth/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify({
          name,
          email,
          password
        })
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || data.message || "Registration failed.");
      }

      alert("Account created successfully!");
      window.location.href = "login.html";

    } catch (error) {
      console.error(error);
      alert(error.message || "Something went wrong.");
      button.disabled = false;
      button.innerHTML = "CREATE ACCOUNT&nbsp; →";
    }
  });
});
</script>




</body>
</html>
