<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A My AI Search v3.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #02051d; color: #fff; font-family: Arial, sans-serif; overflow-x: hidden; }
        .wrap { width: 100%; min-height: 100vh; padding: 10px 12px; background: radial-gradient(circle at 50% 22%, #123aaa 0, transparent 70%); display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        header { width: 100%; height: 60px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 0 10px; }
        .logo { font-size: 20px; font-weight: 800; color: #00a2ff; }
        .robot-stage { position: relative; width: 100%; max-width: 350px; height: 250px; display: flex; justify-content: center; align-items: center; margin: 20px 0; }
        .robot { width: 140px; height: 110px; background: #fff; border-radius: 35px; border: 4px solid #138dff; box-shadow: 0 0 25px #2086ff; position: relative; animation: float 2.5s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
        .screen { position: absolute; top: 25px; left: 15px; width: 102px; height: 52px; background: #02081f; border-radius: 15px; box-shadow: inset 0 0 20px #0a3c99; display: flex; justify-content: center; align-items: center; }
        .eyes { width: 45px; height: 18px; background: #00ffcc; border-radius: 50%; filter: drop-shadow(0 0 8px #00ffcc); position: relative; clip-path: ellipse(50% 40% at 50% 50%); }
        .speech { position: absolute; left: -10px; top: -35px; background: #2bd8ff; color: #02081f; padding: 6px 12px; border-radius: 12px; font-size: 11px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .speech::after { content: ''; position: absolute; bottom: -8px; left: 30px; border-width: 8px 8px 0; border-style: solid; border-color: #2bd8ff transparent; }
        .search-section { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; padding: 0 10px; margin-bottom: 30px; }
        h1 { font-size: 28px; font-weight: bold; text-align: center; margin-bottom: 5px; background: linear-gradient(90deg, #fff, #df42ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sub-text { text-align: center; color: #8a92b2; font-size: 13px; margin-bottom: 10px; }
        .search-bar { display: flex; background: rgba(255,255,255,0.07); border: 1px solid #1d3370; border-radius: 25px; padding: 5px; align-items: center; box-shadow: 0 0 20px rgba(16,40,111,0.2); }
        .search-box { flex: 1; background: transparent; border: none; outline: none; color: #fff; padding: 12px 15px; font-size: 15px; }
        .button-search { background: linear-gradient(90deg, #00d2ff, #9b35ff); color: #fff; border: none; padding: 12px 24px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.3s; }
        .button-search:hover { filter: brightness(1.2); }
        #aiResult { display: none; background: rgba(13, 20, 56, 0.7); border: 1px solid #1e3373; border-radius: 15px; padding: 15px; margin-top: 15px; font-size: 14px; line-height: 1.6; color: #e2e8f0; max-height: 250px; overflow-y: auto; text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .modes { display: flex; justify-content: center; gap: 15px; margin-top: 10px; }
        .mode { font-size: 12px; color: #6a739d; cursor: pointer; padding: 5px 10px; border-radius: 12px; transition: 0.3s; }
        .mode.active, .mode:hover { color: #00d2ff; background: rgba(0,210,255,0.1); }
        footer { font-size: 11px; color: #434c73; text-align: center; padding: 15px 0; width: 100%; border-top: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<div class="wrap">
    <header>
        <div class="logo">A My AI Search</div>
        <div style="color: #00ffcc; font-size: 12px; font-weight: bold;">Free Tier</div>
    </header>

    <div class="robot-stage">
        <div class="speech">"Ask Anything... ✨ Get Smart Answers!"</div>
        <div class="robot">
            <div class="screen">
                <div class="eyes"></div>
            </div>
        </div>
    </div>

    <div class="search-section">
        <h1>Search Smarter with AI Power</h1>
        <div class="sub-text">One Search • Smart Answers • All in One Place</div>
        
        <div class="search-bar">
            <input type="text" class="search-box" placeholder="Ask me anything...">
            <button class="button-search">🚀 Search</button>
        </div>

        <div class="modes">
            <div class="mode active">✨ Smart Search</div>
            <div class="mode">💬 AI Chat</div>
            <div class="mode">🌐 Web Search</div>
        </div>

        <div id="aiResult"></div>
    </div>

    <footer>
        <p>Powered by Groq Cloud AI • Developed by JackGamingOfficial</p>
    </footer>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const searchInput = document.querySelector('.search-box');
    const searchButton = document.querySelector('.button-search');
    const responseContainer = document.getElementById('aiResult');

    // ⚠️ নিচে থাকা ডাবল কোটেশন (" ") এর ভেতরে আপনার আসল Groq API Key টি পেস্ট করে বসিয়ে দিন
    const GROQ_API_KEY = "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";

    searchButton.addEventListener('click', async (e) => {
        e.preventDefault();
        const userQuery = searchInput.value.trim();
        
        if (!userQuery) {
            alert("Please write something!");
            return;
        }

        responseContainer.style.display = "block";
        responseContainer.innerText = "Searching with Groq AI Power... Please wait...";

        try {
            // Groq API এর মাধ্যমে Llama 3 মডেল কল করা হচ্ছে (যা অত্যন্ত ফাস্ট ও ফ্রি)
            const response = await fetch("https://groq.com", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    messages: [
                        { 
                            role: "system", 
                            content: "You are a smart search engine assistant. Give concise answers in the language the user asks." 
                        },
                        { 
                            role: "user", 
                            content: userQuery 
                        }
                    ]
                })
            });

            const data = await response.json();

            if (data.error) {
                responseContainer.innerText = "Error: " + data.error.message;
                return;
            }

            // রেসপন্স থেকে টেক্সট আউটপুট দেখানো
            const aiReply = data.choices[0].message.content;
            responseContainer.innerText = aiReply;

        } catch (error) {
            console.error("Error:", error);
            responseContainer.innerText = "Sorry, something went wrong. Please try again.";
        }
    });
});

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
            .then(() => console.log("Service Worker Registered"))
            .catch(err => console.error("Service Worker Error", err));
    });
}
</script>

</body>
</html>
